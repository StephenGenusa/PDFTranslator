[project]
name = "pdftranslator"
version = "0.1.0"
description = "Layout-preserving PDF translator (side-by-side or full substitution) using LLM translation."
requires-python = ">=3.11"
dependencies = [
    # PDF parsing + rendering
    "pymupdf>=1.27",
    # LLM translation (OpenRouter via the OpenAI-compatible interface, called through litellm)
    "litellm>=1.89",
    # CLI framework
    "typer>=0.26",
    # On-disk translation cache (avoids re-paying for repeated lines)
    "diskcache>=5.6",
    # Progress bars
    "tqdm>=4.68",
]

# dspy/openai/tiktoken/numpy etc. are pulled in transitively by litellm and do
# not need to be declared here.

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[project.scripts]
pdf-translate = "pdftranslator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftranslator"]
artifacts = ["src/pdftranslator/data/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pdftranslator/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
